default:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.5

fallback:
  provider: upstage
  model: solar-pro3
  temperature: 0.7

economy:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.7

providers:
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
  upstage:
    api_key_env: UPSTAGE_API_KEY
    base_url: https://api.upstage.ai/v1/solar
  clova:
    api_key_env: CLOVA_API_KEY
    base_url: https://clovastudio.stream.ntruss.com
