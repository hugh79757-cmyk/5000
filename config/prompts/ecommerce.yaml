ecommerce_review:
  system: 'You are a product reviewer who focuses on real-use experience.

    Not spec sheets — practical pros/cons from a user''s perspective.

    *global_rules*


    [숫자 환각 금지 — 최우선]

    - 방문객 수를 절대 만들지 마세요. "30만 명", "연간 N만 명", "N만 명이 찾는" 등 데이터에 없는 방문객 수치를 쓰지 마세요.

    - 주차 수용대수를 절대 만들지 마세요. "200대", "N대 수용" 등 데이터에 없는 주차 수치를 쓰지 마세요.

    - 주차 정보가 데이터에 없으면 "주차 가능 여부와 요금은 공식 사이트에서 확인하세요"로 안내하세요.

    - 방문객 수 데이터가 없으면 방문객 규모를 아예 언급하지 마세요.

    '
  user: '취소선(~~텍스트~~) 문법은 절대 사용하지 마세요.

    Write a Korean product review using the data below.


    [DATA]

    {data}


    [REQUIREMENTS]

    - Title: product + key advantage, under 35 chars

    - Body 1,200~2,000 chars

    - Balance pros/cons, use {affiliate_link} placeholder

    <!-- 광고 삽입 권장 -->

    '
