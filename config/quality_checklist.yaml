      severity: MAJOR
      description: "본문 구조 순서: 타이틀→설명문→첫 소제목"
      agent_action: null
    - id: CAP_FORBIDDEN
      target: content
      severity: MAJOR
      description: "금지: 곡선따옴표, CoT 잔재, 프론트매터 키 유출, draft:true"
      agent_action: fix_c04
    - id: CAP_THUMB_R2
      target: featureimage
