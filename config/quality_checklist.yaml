      agent_action: null
    - id: CUAP_BODY_ORDER
      target: content
      severity: MAJOR
      description: "본문 구조 순서: 타이틀→설명문→첫 소제목"
      agent_action: null
    - id: CUAP_FORBIDDEN
      target: content
      severity: MAJOR
      description: "금지: 곡선따옴표, CoT 잔재, 프론트매터 키 유출, draft:true"
      agent_action: fix_c04
    - id: CUAP_THUMB_R2
      target: featureimage
      severity: MAJOR
      description: "featureimage R2 webp + 본문 이미지 R2"
      agent_action: fix_thumbnail_r2
    - id: CUAP_AD_INSERT
      target: adsense
      severity: MAJOR
      description: "광고 삽입 규칙: in-article fluid + top overflow"
      agent_action: fix_r06
  stap:
    - id: STAP_FM_REQUIRED
      target: frontmatter
      severity: MAJOR
      description: "필수 키: title, date, slug, categories, tags, featureimage"
      agent_action: null
    - id: STAP_BODY_ORDER
      target: content
      severity: MAJOR
      description: "본문 구조 순서: 타이틀→설명문→첫 소제목"
      agent_action: null
    - id: STAP_FORBIDDEN
