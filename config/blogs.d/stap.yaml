  domain: finance.techpawz.com
  id: finance-hugo
  name: 금리·예적금 비교
  pipeline: stock
  platform: hugo
  repo: finance-hugo
  schedule:
    times:
    - 07:32
    - '10:32'
    - '13:32'
    - '16:32'
    - '20:32'
  status: active
  theme: blowfish
  site_path: /Users/twinssn/Projects/STAP/finance-hugo
  funnel_stage: landing
  managed_by: pipeline

