# ═══════════════════════════════════════════════════════════════════════════════
# STAP Funnel: 얕은 금융 → 깊은 투자 (shallow → deep)
# finance(landing) → stock → dividend/etf → sector → ipo(monetize)
# bridge_to 없음 — STAP은 RAP bridge의 대상 카테고리. depth_next로 내부 흐름.
# ═══════════════════════════════════════════════════════════════════════════════

