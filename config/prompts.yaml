    - 제목에 숫자(5곳, 3곳 등)를 명시하면 본문에서 정확히 그 수만큼 균등하게 서술하세요.

    - 제목에 ''무료''라고 명시하면 유료 장소를 포함하지 마세요.

    - 제목의 키워드(지역, 테마, 숫자)는 본문과 반드시 일치해야 합니다.


    [문체 통일]

    - "~다" 체로 통일. "~세요", "~까요", "~하세요" 사용 금지.

    [문장 완성]

    - 모든 문장은 반드시 온전한 형태로 끝내세요. 잘린 문장 금지.

