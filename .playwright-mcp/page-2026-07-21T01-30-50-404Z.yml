              - generic [ref=f19e397]: "주방에서 반찬 보관용기 고르다 보면 ‘유리 vs 플라스틱’ 고민이 끊이지 않습니다. 특히 2026년 7월 기준으로 전자레인지·오븐·냉동실까지 자유자재로 사용할 수 있는 내열유리 용기가 인기를 끌고 있습니다. 반찬을 한 번에 많이 만들어 냉장 보관하거나, 밥을 지어 냉동실에 소분해두는 분들이라면 안전한 재질과 적당한 크기 구성이 무엇보다 중요합니다. 유리밀폐용기 고를 때 확인할 포인트 # 1. 소재: 내열유리인지 확인하세요 # 일반 유리는 열충격에 깨질 위험이 있습니다. 반드시 ‘내열유리’ 또는 ‘내열강화유리’ 표기가 있는 제품을 선택하세요. 전자레인지와 오븐 사용이 가능한지도 제품 설명에서 꼭 확인해야 합니다."
