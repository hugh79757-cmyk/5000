                  - text: "#"
              - paragraph [ref=e178]: 일반적으로 물세탁이 가능한 제품이 많습니다. 다만 내부에 그을음이나 기름때가 많이 묻었을 경우 중성세제를 푼 미지근한 물에 손세탁하거나, 물티슈로 닦아내는 것이 좋습니다. 세탁기를 사용하면 원단이 손상될 수 있으니 주의하세요.
