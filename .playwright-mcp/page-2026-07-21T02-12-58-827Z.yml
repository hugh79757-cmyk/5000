                  - text: "#"
              - paragraph [ref=e174]: 캠핑장에 도착했는데 갑자기 비가 내리거나, 아침 이슬이 그릴에 맺히는 경험을 한 번씩 해보셨을 겁니다. 방수 처리가 된 가방은 이런 상황에서 그릴을 완전히 보호해줍니다. 특히 비수기(봄·가을)나 장마철에 캠핑을 자주 가는 분이라면 방수 기능이 있는 제품을 추천합니다.
              - heading [level=3] [ref=e175]:
                - text: 그릴가방을 세탁할 수 있나요?
                - link "앵커" [ref=e177] [cursor=pointer]:
