                  - /url: "#%ea%b7%b8%eb%a6%b4%ea%b0%80%eb%b0%a9%ec%9d%80-%eb%aa%a8%eb%93%a0-%ea%b7%b8%eb%a6%b4%ec%97%90-%eb%8b%a4-%eb%93%a4%ec%96%b4%ea%b0%80%eb%82%98%ec%9a%94"
                  - text: "#"
              - paragraph [ref=e170]: 아닙니다. 그릴가방은 크게 일반형과 전용형으로 나뉩니다. 일반형(SN월드 같은 특대형 제품)은 다양한 그릴을 수납할 수 있지만 너무 작거나 큰 그릴은 맞지 않을 수 있습니다. 전용형(캠핑몽 카고, 스테츠 핏보이)은 특정 그릴에 맞춰 제작되어 호환성이 제한됩니다. 구매 전 반드시 본인 그릴의 접은 상태 가로·세로 치수를 확인하세요.
              - heading [level=3] [ref=e171]:
                - text: 방수 기능이 정말 필요할까요?
