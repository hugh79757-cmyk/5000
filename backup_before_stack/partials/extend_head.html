{{- /* Google Analytics */ -}}
<script>
  (function () {
    function loadAnalytics() {
      var script = document.createElement('script');
      script.src = 'https://www.googletagmanager.com/gtag/js?id=G-L3D3EGH8YN';
      script.async = true;
      document.head.appendChild(script);
      script.onload = function () {
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-L3D3EGH8YN');
      };
    }
    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadAnalytics);
    } else {
      window.addEventListener('load', function () {
        setTimeout(loadAnalytics, 100);
      });
    }
  })();
</script>

{{- /* AdSense - 즉시 로드 + 자동 초기화 */ -}}
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8772455780561463" crossorigin="anonymous"></script>
<script>
  window.addEventListener('load', function() {
    setTimeout(function() {
      var ads = document.querySelectorAll('ins.adsbygoogle');
      ads.forEach(function(ad) {
        if (!ad.getAttribute('data-adsbygoogle-status')) {
          (adsbygoogle = window.adsbygoogle || []).push({});
        }
      });
    }, 500);
  });
</script>
