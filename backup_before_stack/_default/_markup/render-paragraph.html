{{- $content := .Text | safeHTML -}}
{{- $page := .Page -}}
{{- $ordinal := .Ordinal -}}

<p>{{ $content }}</p>

{{- /* 첫 번째 문단 뒤에 광고 삽입 */ -}}
{{- if and (eq $ordinal 0) $page.IsPage -}}
<div class="ad-slot ad-after-first-p">
  <ins class="adsbygoogle" 
       style="display:block; text-align:center; min-height:250px; margin: 20px 0;"
       data-ad-client="ca-pub-8772455780561463" 
       data-ad-slot="4098670212" 
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
</div>
{{- end -}}
