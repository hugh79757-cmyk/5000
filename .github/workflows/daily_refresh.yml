name: daily_refresh (runner state replenish)

on:
  schedule:
    - cron: "30 0 * * *"  # 00:30 UTC = 07:30 +07 (deal 발행 01:30 UTC 1시간 전, RC-4)
  workflow_dispatch:

concurrency:
  group: publish-lock-car
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # 카이즈유 크롤 프록시 (GH IP 403 차단 → CF Pages Function 경유)
      CARISYOU_M_BASE: https://deal.rotcha.kr/proxy/m
      CARISYOU_W_BASE: https://deal.rotcha.kr/proxy/w
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pull latest state from R2
        run: |
          python scripts/run_slot.py rank-hugo --get-only
          # R2 -> 로컬 12객체 복원 (manifest md5 검증 포함)
      - name: "Refresh car data — LIVE MODE (2026-11-09 deal 부활, 크롤+토픽보충 전부 러너 수행, 맥 의존 제거)"
        run: |
          python -m pipelines.car.daily_refresh
          # 카이즈유 크롤(트림/가격/이미지) + owner=runner 블로그 토픽 보충
      - name: Put state back to R2 (get 재수행 금지 — 로컬 변경분 보존)
        run: |
          python scripts/run_slot.py rank-hugo --put-only
          # --put-only = get_state·dispatcher 스킵 + put_state만 (run_slot.py main)
