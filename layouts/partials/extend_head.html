<!-- DNS Prefetch & Preconnect -->

<!-- 폰트 Preload (LCP 개선) -->
<link rel="preload"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2"
  as="font" type="font/woff2" crossorigin>

<!-- LCP 이미지 Preload (홈페이지인 경우) -->
{{ if .IsHome }}
{{ $pages := where .Site.RegularPages "Type" "posts" }}
{{ $featured := first 1 $pages }}
{{ range $featured }}
{{ $image := .Resources.GetMatch "thumbnail.*" }}
{{ if $image }}
<link rel="preload" href="{{ $image.RelPermalink }}" as="image" fetchpriority="high">
{{ else if .Params.cover.image }}
<link rel="preload" href="{{ .Params.cover.image }}" as="image" fetchpriority="high">
{{ end }}
{{ end }}
{{ end }}

<!-- 프리텐다드 폰트 (더 가벼운 로딩) -->
<style>
  @font-face {
    font-family: 'Pretendard';
    font-weight: 400;
    font-display: swap;
    src: local('Pretendard Regular'),
      url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2');
  }

  @font-face {
    font-family: 'Pretendard';
    font-weight: 700;
    font-display: swap;
    src: local('Pretendard Bold'),
      url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2');
  }

  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
  }
</style>
