<!-- Critical CSS 인라인 -->
<style>
:root{--gap:24px;--content-gap:20px;--nav-width:1024px;--main-width:720px;--header-height:60px;--footer-height:60px;--radius:8px;--theme:#fff;--entry:#fff;--primary:#1e1e1e;--secondary:#6c6c6c;--tertiary:#d6d6d6;--content:#1f1f1f;--code-bg:#f5f5f5;--border:#eee}
:root[data-theme="dark"]{--theme:#1d1e20;--entry:#2e2e33;--primary:#dadada;--secondary:#9b9c9d;--tertiary:#414244;--content:#c4c4c5;--code-bg:#373840;--border:#333}
*,::after,::before{box-sizing:border-box}
body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:18px;line-height:1.6;background:var(--theme);color:var(--primary)}
.header{background:var(--theme)}
.nav{display:flex;flex-wrap:wrap;justify-content:space-between;max-width:calc(var(--nav-width) + var(--gap)*2);margin:auto;line-height:var(--header-height)}
.main{max-width:calc(var(--main-width) + var(--gap)*2);margin:auto;padding:var(--gap)}
.entry-cover img{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:var(--radius)}
.ad-slot{min-height:250px}
@media(max-width:768px){.ad-slot{min-height:200px};:root{--gap:14px}}
</style>

@font-face{font-family:'Pretendard';font-weight:400;font-display:swap;src:local('Pretendard Regular'),url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2-subset/Pretendard-Regular.subset.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;font-display:swap;src:local('Pretendard Bold'),url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2-subset/Pretendard-Bold.subset.woff2') format('woff2')}
</style>

<!-- LCP 이미지 Preload -->
{{- if .IsHome }}
  {{- $pages := where .Site.RegularPages "Type" "posts" }}
  {{- range first 1 $pages }}
    {{- with .Params.cover.image }}
<link rel="preload" href="{{ . | absURL }}" as="image" fetchpriority="high">
    {{- end }}
  {{- end }}
{{- else if .IsPage }}
  {{- with .Params.cover.image }}
<link rel="preload" href="{{ . | absURL }}" as="image" fetchpriority="high">
  {{- end }}
{{- end }}
