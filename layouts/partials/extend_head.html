<!-- Google Analytics (5초 후 로딩) -->
<script>
setTimeout(function() {
  var s = document.createElement('script');
  s.src = 'https://www.googletagmanager.com/gtag/js?id=G-L3D3EGH8YN';
  s.async = true;
  document.head.appendChild(s);
  s.onload = function() {
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-L3D3EGH8YN');
  };
}, 5000);
</script>

<!-- AdSense (인터랙션 또는 5초 후 로드) -->
<script>
var adsenseLoaded=false;
function loadAdsense(){
  if(adsenseLoaded)return;
  adsenseLoaded=true;
  var s=document.createElement("script");
  s.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8772455780561463";
  s.async=true;
  s.crossOrigin="anonymous";
  document.head.appendChild(s);
}
["scroll","mousemove","touchstart","keydown"].forEach(function(e){
  window.addEventListener(e,loadAdsense,{once:true,passive:true});
});
setTimeout(loadAdsense,5000);
</script>
