{{- /* AdSense 레이지로드 (인터랙션 또는 3초 후) */ -}}
<script>
(function() {
  var loaded = false;
  function loadAdsense() {
    if (loaded) return;
    loaded = true;
    var s = document.createElement('script');
    s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8772455780561463';
    s.async = true;
    s.crossOrigin = 'anonymous';
    document.head.appendChild(s);
  }
  ['scroll', 'click', 'touchstart', 'mousemove'].forEach(function(e) {
    window.addEventListener(e, loadAdsense, {once: true, passive: true});
  });
  setTimeout(loadAdsense, 3000);
})();
</script>

{{- /* Google Analytics - 지연 로딩 */ -}}
<script>
(function() {
  function loadGA() {
    var s = document.createElement('script');
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-L3D3EGH8YN';
    s.async = true;
    document.head.appendChild(s);
    s.onload = function() {
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L3D3EGH8YN');
    };
  }
  if (document.readyState === 'complete') {
    setTimeout(loadGA, 100);
  } else {
    window.addEventListener('load', function() { setTimeout(loadGA, 100); });
  }
})();
</script>
