<!-- 프리텐다드 폰트 -->

@font-face {
  font-family: 'Pretendard';
  font-weight: 400;
  font-display: swap;
  src: local('Pretendard Regular'),
    url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2');

@font-face {

}
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
</style>

<!-- LCP 이미지 Preload (홈페이지인 경우) -->
{{ if .IsHome }}
{{ $pages := where .Site.RegularPages "Type" "posts" }}
{{ $featured := first 1 $pages }}
{{ range $featured }}
{{ $image := .Resources.GetMatch "thumbnail.*" }}
{{ if $image }}
<link rel="preload" href="{{ $image.RelPermalink }}" as="image" fetchpriority="high">
{{ else if .Params.cover.image }}
<link rel="preload" href="{{ .Params.cover.image }}" as="image" fetchpriority="high">
{{ end }}
{{ end }}
{{ end }}

<!-- Google Analytics (idle 시 로딩) -->
<script>
(function () {
  function loadAnalytics() {
    var script = document.createElement('script');
    script.src = 'https://www.googletagmanager.com/gtag/js?id=G-L3D3EGH8YN';
    script.async = true;
    document.head.appendChild(script);
    script.onload = function () {
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-L3D3EGH8YN');
    };
  }
  if ('requestIdleCallback' in window) {
    requestIdleCallback(loadAnalytics);
  } else {
    window.addEventListener('load', function () {
      setTimeout(loadAnalytics, 100);
    });
  }
})();
</script>

<!-- AdSense (인터랙션/3초 후 로드) -->
<script>
var adsenseLoaded=false;
function loadAdsense(){
  if(adsenseLoaded)return;
  adsenseLoaded=true;
  var s=document.createElement("script");
  s.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8772455780561463";
  s.async=true;
  s.crossOrigin="anonymous";
  document.head.appendChild(s);
}
["scroll","mousemove","touchstart","keydown"].forEach(function(e){
  window.addEventListener(e,loadAdsense,{once:true,passive:true});
});
setTimeout(loadAdsense,3000);
</script>
