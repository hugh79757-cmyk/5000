<!-- 함께 읽으면 좋은 글 -->
{{ $related := .Site.RegularPages.Related . | first 5 }}
{{ with $related }}
<div class="related-posts" style="margin-top: 2rem; padding: 1.5rem; background: var(--code-bg); border-radius: 8px;">
  <h3 style="margin-bottom: 1rem;">📚 함께 읽으면 좋은 글</h3>
  <ul style="list-style: none; padding: 0; margin: 0;">
    {{ range . }}
    <li style="margin-bottom: 0.8rem;">
      <a href="{{ .Permalink }}" style="color: var(--primary);">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
