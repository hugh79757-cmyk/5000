{{- /* 수동 광고 초기화 */ -}}
<script>
window.addEventListener('load', function() {
    document.querySelectorAll('ins.adsbygoogle[data-ad-slot]').forEach(function(ad) {
        if (!ad.getAttribute('data-adsbygoogle-status')) {
            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
            } catch(e) {}
        }
    });
});
</script>
