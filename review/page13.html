<div class="toolbar">
<span class="count-badge" id="sel-count">0개 선택</span>
<button style="background:#4a9eff;color:#fff" onclick="copyIds()">삭제 ID 복사</button>
<button style="background:#555;color:#fff" onclick="deselectAll()">전체 해제</button>
</div>
<script>
function toggleCard(cb) { document.getElementById('card-'+cb.value).classList.toggle('selected',cb.checked); updateCount(); }
function updateCount() { document.getElementById('sel-count').textContent=document.querySelectorAll('.del-check:checked').length+'개 선택'; }
function copyIds() {
  var ids=Array.from(document.querySelectorAll('.del-check:checked')).map(function(c){return c.value});
  if(!ids.length){alert('선택 없음');return;}
  navigator.clipboard.writeText('삭제할 ID: '+ids.join(',')).then(function(){alert(ids.length+'개 ID 복사됨')});
}
function deselectAll() { document.querySelectorAll('.del-check').forEach(function(c){c.checked=false;toggleCard(c)}); }
</script></body></html>
