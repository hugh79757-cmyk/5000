[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=shared --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["shared"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "D200",  # Docstring fits on one line
    "D205",  # Blank line after docstring
    "D400",  # Docstring ends in period
    "D401",  # Docstring imperative mood
    "D415",  # Docstring ends in punctuation
    "COM812", # Trailing comma missing
    "ISC001", # Implicit string concat
    "EM101",  # Exception must not use string literal
    "PLR2004", # Magic value comparison
    "S101",   # Use of assert
    "T201",   # `print` found
    "E501",   # Line too long — legacy codebase, not enforced
    "ANN",    # Missing type annotations — legacy codebase, phased adoption
    "G004",   # Logging f-string — pervasive legacy pattern
    "PTH",    # os.path vs pathlib — pervasive in legacy code
    "PLC0415", # Import outside top-level — common pattern here
    "BLE001", # Blind except — pervasive legacy pattern
    "TRY",    # Try-related rules — too strict for legacy
    "DTZ005", # Datetime without tz — legacy pattern
    "ARG001", # Unused function argument — legacy
    "C901",   # Too complex — legacy code
    "S603",   # Subprocess with shell=true — legacy
    "F401",   # Imported but unused — too noisy for first pass
    "RUF",    # RUF-specific rules — some too pedantic
    "E402",   # Module-level import not at top — legacy pattern
    "N806",   # Variable name casing — legacy style
    "E722",   # Bare except — pervasive in legacy
    "G003",   # Logging `+` concat — legacy
    "E701",   # Multiple statements on one line — legacy
    "S110",   # Try-except-pass — pervasive in legacy
    "S608",   # Hardcoded SQL — pervasive
    "S311",   # Pseudo-random generators — not security-critical
    "W293",   # Blank line whitespace — auto-fix
    "PLW1510", # subprocess.run without check — legacy
    "PERF401", # Use list comprehension — minor perf
    "PLR",    # Pylint refactoring rules — too strict for legacy
    "F821",   # Undefined name — pre-existing bugs, not part of this phase
    "FBT",    # Boolean positional arg — style, not errors
    "SIM115", # Use context manager — legacy pattern
    "S1",     # Security rules (exec, pickle, mktemp, etc.) — legacy
    "S3",     # More security rules (urlopen, XML, etc.) — legacy
    "S5",     # More security rules — legacy
    "S6",     # More security rules (subprocess, shell) — legacy
    "DTZ",    # Datetime tz — legacy
    "EXE",    # Shebang conventions — minor
    "ERA",    # Commented-out code — intentional
    "E702",   # Multiple statements — legacy
    "E741",   # Ambiguous variable name — legacy
    "G002",   # Logging percent format — legacy
    "INP001", # Implicit namespace — no package structure
    "N802",   # Invalid function name — legacy
    "N814",   # Camelcase imported as constant — legacy
    "SIM102", # Collapsible if — minor
    "SIM113", # Enumerate — minor
    "ARG005", # Unused lambda arg — legacy
    "B007",   # Unused loop var — legacy
    "B023",   # Function uses loop variable — legacy
    "B904",   # Raise without from — minor
    "F601",   # Repeated key literal — legacy
    "PERF402", # Manual list copy — minor
    "PLW0602", # Global not assigned — legacy
    "PLW0603", # Global statement — legacy
    "PLW2901", # Redefined loop name — legacy
    "SLF001", # Private member access — legacy
    "UP031",  # Printf formatting — legacy
    "UP035",  # Deprecated import — legacy
    "I001",   # Unsorted imports — legacy
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # Allow assert in tests
    "D",      # No docstring requirements for tests
]
"**/__init__.py" = ["F403", "F401"]
"**/*.bak*" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
show_error_codes = true
files = ["shared/", "dispatcher.py", "scheduler.py"]
check_untyped_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_unimported = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
disable_error_code = [
    "var-annotated",
    "name-defined",
    "assignment",
    "union-attr",
    "return-value",
    "call-arg",
    "attr-defined",
    "operator",
]

[[tool.mypy.overrides]]
module = [
    "shared.blogger_publisher",
    "shared.wordpress_publisher",
    "shared.r2_uploader",
    "shared.coupang_senior",
    "shared.coupang_car",
    "shared.coupang_travel",
]
ignore_errors = true
