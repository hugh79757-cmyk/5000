<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 600px; height: 600px;
    overflow: hidden;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .canvas {
    width: 600px; height: 600px;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.7) 100%),
      url('{{ background_data_uri }}') center/cover no-repeat;
  }
  .content {
    position: absolute;
    bottom: 68px; left: 0;
    width: 100%;
    padding: 0 48px;
    z-index: 2;
  }
  .cat-pill {
    display: inline-block;
    padding: 6px 16px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    background: rgba(255,255,255,0.18);
    color: #fff;
    margin-bottom: 14px;
    border-radius: 2px;
  }
  .title {
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: #fff;
    word-break: keep-all;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .title-line1 { font-size: {{ title1_size }}px; }
  .title-line2 { font-size: {{ title2_size }}px; margin-top: 6px; opacity: 0.88; }
  .year-highlight {
    color: #fde94e;
  }
  .site-bar {
    position: absolute;
    bottom: 26px;
    right: 48px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.45);
    z-index: 2;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="content">
    {% if category %}
    <div class="cat-pill">{{ category }}</div>
    {% endif %}
    <div class="title">
      {% set title_l1 = title_line1 | replace("2026", '<span class="year-highlight">2026</span>') | replace("2025", '<span class="year-highlight">2025</span>') %}
      <div class="title-line1">{{ title_l1 | safe }}</div>
      {% if title_line2 %}
      <div class="title-line2">{{ title_line2 }}</div>
      {% endif %}
    </div>
  </div>
  <div class="site-bar">{{ site_bar }}</div>
</div>
</body>
</html>
