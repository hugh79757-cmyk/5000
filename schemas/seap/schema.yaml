# seap/schema.yaml — SEAP 분기 스키마
# 상속: _base/default.yaml (deep-merge)
# 근거: 표본 senior-hugo(40) frontmatter (2026-08-22)
#   - featureimage 존재율: 40/40 — 필수
#   - title: 잘림 20/40 (50%) — 기존 발행물 절반이 '…' 잘림
#     → forbid_ellipsis=false + allow_suffix (수용). 단, 신규 잘림은 writer 개선으로 지향 (TODO)
#   - OG: featureimage 필수 + thumbnail 키 존재 (5/40)
#   - _base와의 차이: featureimage required + title 접미사 수용

required_frontmatter: [title, description, date, slug, tags, featureimage]
allowed_og_patterns:
  - "https://pub-[a-z0-9]+\\.r2\\.dev/.+"
  - "https://[a-z0-9-]+\\.informationhot\\.kr/.+"
title_format_rule:
  max_len: 80
  forbid_ellipsis: false         # 기존 발행물 20/40 '…' 잘림 (표본 senior)
  allow_suffix: ["…"]
live_og_format_rule: contains
og_rule:
  og_image_required: true        # 표본 40/40 필수
  og_image_source: featureimage
empty_value_policy:
  featureimage: disallow
template_constraints:
  thumbnail_allowed: true        # Blowfish thumbnail 키 허용 (senior-hugo 5/40)
