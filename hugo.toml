baseURL = 'https://rotcha.kr/'
languageCode = 'ko-kr'
title = 'rotcha'
theme = 'PaperMod'

enableRobotsTXT = true
canonifyURLs = true

[params]
defaultTheme = "auto"
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = true
TocOpen = false
description = "일상 정보, 영업시간, 생활 꿀팁을 알려드리는 rotcha 블로그"
env = "production"
author = "rotcha"
images = ["/og-image.png"]
keywords = ["생활정보", "영업시간", "꿀팁", "일상"]

[params.cover]
responsiveImages = true

[params.assets]
favicon = "/favicon.ico"

[params.homeInfoParams]
Title = "rotcha"
Content = "일상 정보, 영업시간, 생활 꿀팁"

[[menu.main]]
name = "글목록"
url = "/archives/"
weight = 1

[[menu.main]]
name = "검색"
url = "/search/"
weight = 2

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
taxonomy = ["HTML"]
term = ["HTML"]

[minify]
disableXML = true
minifyOutput = true

[permalinks]
posts = "/posts/:slug/"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[sitemap]
changefreq = "daily"
priority = 0.5
filename = "sitemap.xml"

[services.rss]
limit = 50
