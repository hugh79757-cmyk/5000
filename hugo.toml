baseURL = 'https://rotcha.kr/'
languageCode = 'ko-kr'
title = 'rotcha'
theme = 'PaperMod'

googleAnalytics = 'GT-5TC34W4'

enableRobotsTXT = true
canonifyURLs = true

[build]
[build.buildStats]
enable = true

[[build.cachebusters]]
source = "assets/.*\\.(js|ts|jsx|tsx)"
target = "(js|scripts|javascript)"

[[build.cachebusters]]
source = "assets/.*\\.(css|sass|scss)"
target = "(css|styles|scss|sass)"

[imaging]
quality = 85
resampleFilter = "Lanczos"
anchor = "Smart"

[imaging.exif]
disableDate = true
disableLatLong = true

[params]
defaultTheme = "auto"
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = true
TocOpen = false
description = "일상 정보, 영업시간, 생활 꿀팁을 알려드리는 rotcha 블로그"
env = "production"
author = "rotcha"
keywords = ["생활정보", "영업시간", "꿀팁", "일상"]
mainSections = ["posts"]

[params.cover]
responsiveImages = true
hidden = false
hiddenInList = false
hiddenInSingle = false

[params.assets]
favicon = "/favicon.png"
disableFingerprinting = false

[params.homeInfoParams]
Title = "rotcha"
Content = "일상 정보, 영업시간, 생활 꿀팁"

[[menu.main]]
name = "글목록"
url = "/archives/"
weight = 1

[[menu.main]]
name = "검색"
url = "/search/"
weight = 2

[[menu.main]]
identifier = "cert-exam"
name = "자격증시험"
url = "/categories/자격증시험/"
weight = 3

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
taxonomy = ["HTML"]
term = ["HTML"]

[minify]
disableXML = true
minifyOutput = true

[permalinks]
posts = "/posts/:slug/"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions]
strikethrough = false

[markup.goldmark.parser]
autoHeadingID = true
autoHeadingIDType = "github"

[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
lineNos = false

[sitemap]
changefreq = "daily"
priority = 0.5
filename = "sitemap.xml"

[services]
[services.googleAnalytics]
ID = 'GT-5TC34W4'

[services.rss]
limit = 50

# [related] - 비활성화
# includeNewer = true
# threshold = 50
# toLower = true

# [[related.indices]]
# name = "tags"
# weight = 100

# [[related.indices]]
# name = "categories"
# weight = 80

[caches]
[caches.images]
dir = ':cacheDir/images'
maxAge = "1440h"

[caches.assets]
dir = ':cacheDir/assets'
maxAge = "1440h"
